[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "basha"
version = "0.2.0.dev0"
requires-python = ">=3.10"
dependencies = ["torch", "transformers>=4.40", "sentencepiece"]

[project.optional-dependencies]
dev = ["pytest", "datasets", "scikit-learn"]

[tool.setuptools.packages.find]
where = ["src"]