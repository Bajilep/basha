[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "basha-sentiment"
version = "0.3.0"
description = "A lightweight, explainable and customizable sentiment and emotion analysis library."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }

authors = [
    { name = "Bajil Mohammed E.P.", email = "bajilmarakkar929@gmail.com" }
]

keywords = [
    "sentiment-analysis",
    "emotion-analysis",
    "natural-language-processing",
    "nlp",
    "sarcasm-detection",
    "text-analysis",
    "social-media",
    "python"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic"
]

dependencies = []


[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "build>=1.0",
    "twine>=5.0"
]

benchmark = [
    "vaderSentiment>=3.3.2",
    "textblob>=0.18"
]


[project.urls]
Homepage = "https://github.com/Bajilep/basha"
Repository = "https://github.com/Bajilep/basha"
Issues = "https://github.com/Bajilep/basha/issues"


[tool.setuptools]
package-dir = { "" = "src" }


[tool.setuptools.packages.find]
where = ["src"]
include = ["basha*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
